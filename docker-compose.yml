  # ───────────── Base de datos ─────────────
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data # persistencia
    ports:
      - "${DB_PORT_HOST:-5432}:5432" # opcional: acceso desde un cliente SQL
    healthcheck:
      # $$ evita que Compose interpole la variable en el host; la resuelve el contenedor
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ───────────── Backend Django/DRF ─────────────
